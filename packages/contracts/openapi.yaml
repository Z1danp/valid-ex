openapi: 3.0.3
info:
  title: Valid-Ex API Contract
  version: 1.0.0
  description: |
    Auditable Statistical Calibration, Residual Diagnostics, & Native Formula Excel Engine
    for Analytical Chemistry (ISO/IEC 17025 & EURACHEM Compliant).
    
    Serves as the Single Source of Truth (SSOT) between Frontend (React @ Vercel)
    and API Gateway (Hono @ Vercel Serverless).

servers:
  - url: /api/v1
    description: Vercel Serverless API Gateway

tags:
  - name: Auth
    description: Pengelolaan akun pengguna, autentikasi lokal, dan Google OAuth SSO
  - name: Calibrations
    description: Pengolahan kurva kalibrasi multi-analit, kuantifikasi sampel, dan evaluasi QC ISO 17025
  - name: Reports
    description: Pembangkitan dan pengunduhan lembar kerja Excel (.xlsx) dengan formula native
  - name: QCProfiles
    description: Pengelolaan profil kriteria QC ber-versi (governed, immutable, bersitasi methodRef)

paths:
  # =========================================================================
  # AUTH DOMAIN
  # =========================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Pendaftaran pengguna baru (Lokal Email & Password)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Pengguna berhasil didaftarkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Masuk menggunakan Email dan Password lokal
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil, mengembalikan JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Akun terdaftar via OAuth (penolakan login manual tanpa password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google:
    post:
      tags: [Auth]
      summary: Autentikasi Single Sign-On via Google OAuth
      operationId: loginGoogleOAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Autentikasi Google berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token Google OAuth tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Mengambil profil pengguna yang sedang login
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # =========================================================================
  # CALIBRATION & MEASUREMENT DOMAIN
  # =========================================================================
  /calibrations:
    post:
      tags: [Calibrations]
      summary: Validasi, perhitungan, dan penyimpanan batch pengujian kalibrasi
      description: |
        Menerima batch pengujian lengkap (standar dan sampel multi-analit).
        Backend memvalidasi perhitungan metrologi via `@valid-ex/math`, mengevaluasi kriteria QC
        (korelasi Pearson, CCV drift, RPD duplo, recovery spike), dan menyimpan data secara ACID.
        Sesuai Invariant D4 & ADR-0005, jika QC gagal, data tetap disimpan dengan status INVALID_QC (Soft-Flag).
      operationId: createCalibrationBatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationBatchRequest'
      responses:
        '201':
          description: Batch kalibrasi berhasil diproses dan disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Pelanggaran batas metrologi fatal (misal deret standar non-zero < 5 titik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Calibrations]
      summary: Mengambil daftar riwayat batch kalibrasi pengguna
      operationId: listCalibrationBatches
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: instrument
          in: query
          schema:
            $ref: '#/components/schemas/InstrumentType'
        - name: qcStatus
          in: query
          schema:
            $ref: '#/components/schemas/QCStatus'
      responses:
        '200':
          description: Daftar batch kalibrasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /calibrations/{id}:
    get:
      tags: [Calibrations]
      summary: Mengambil detail lengkap 1 batch pengujian dan hasil kuantifikasinya
      operationId: getCalibrationBatchById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CalibrationIdParam'
      responses:
        '200':
          description: Detail batch kalibrasi ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationBatchResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Calibrations]
      summary: Menghapus batch kalibrasi
      operationId: deleteCalibrationBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CalibrationIdParam'
      responses:
        '204':
          description: Batch kalibrasi berhasil dihapus
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # REPORT & SPREADSHEET EXPORT DOMAIN
  # =========================================================================
  /calibrations/{id}/export:
    get:
      tags: [Reports]
      summary: Mengunduh lembar kerja spreadsheet audit trail (.xlsx)
      description: |
        Menghasilkan file Excel biner (.xlsx) berisi formula native Excel (=SLOPE, =INTERCEPT, =IF)
        dan tabel terstruktur. Semua string pengguna disanitasi dari formula injection (Anti-CWE-1236).
      operationId: exportCalibrationExcel
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CalibrationIdParam'
      responses:
        '200':
          description: File spreadsheet binary hasil olah data (.xlsx)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="ICP-MS_Batch_2026-09-27.xlsx"'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

# ===========================================================================
# QC CRITERIA PROFILE DOMAIN (Governed, Versioned)
# ===========================================================================
  /qc-profiles:
    get:
      tags: [QCProfiles]
      summary: Mengambil daftar profil kriteria QC milik pengguna
      operationId: listQcProfiles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daftar profil berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QCCriteriaProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [QCProfiles]
      summary: Membuat profil kriteria QC baru (versi berikutnya bila nama sama)
      operationId: createQcProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QCCriteriaProfileInput'
      responses:
        '201':
          description: Profil berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QCCriteriaProfile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Profil tidak valid (band tidak kontigu, tidak ada catch-all, atau analit duplikat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qc-profiles/{id}:
    get:
      tags: [QCProfiles]
      summary: Mengambil satu profil kriteria QC (versi terbaru)
      operationId: getQcProfileById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QcProfileIdParam'
      responses:
        '200':
          description: Profil ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QCCriteriaProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

# ===========================================================================
# COMPONENTS & SCHEMAS
# ===========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CalibrationIdParam:
      name: id
      in: path
      required: true
      description: UUID unik batch kalibrasi
      schema:
        type: string
        format: uuid
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
    QcProfileIdParam:
      name: id
      in: path
      required: true
      description: UUID unik profil kriteria QC
      schema:
        type: string
        format: uuid
        example: "3f8a1c2e-9b7d-4bad-9bdd-2b0d7b3dcb6d"

  responses:
    BadRequestError:
      description: Request payload tidak valid atau gagal validasi skema
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Token autentikasi hilang, kedaluwarsa, atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Sumber daya yang diminta tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # -----------------------------------------------------------------------
    # Auth Schemas
    # -----------------------------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: "analis@lab.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "SuperSecureLab123!"
        name:
          type: string
          minLength: 2
          example: "Zidan"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "analis@lab.com"
        password:
          type: string
          format: password
          example: "SuperSecureLab123!"

    GoogleAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google OAuth Identity Token
          example: "eyJhbGciOiJSUzI1NiIs..."

    UserProfile:
      type: object
      required: [id, email, name, authProvider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        authProvider:
          type: string
          enum: [local, google]
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT Access Token
        tokenType:
          type: string
          default: "Bearer"
        user:
          $ref: '#/components/schemas/UserProfile'

    # -----------------------------------------------------------------------
    # Metrology & Unit Schemas
    # -----------------------------------------------------------------------
    InstrumentType:
      type: string
      enum: [ICP-MS, ICP-OES, AAS, HPLC, GC-MS]
      example: "ICP-MS"

    InputMode:
      type: string
      enum: [raw_signal, in_vial_concentration]
      description: |
        Menentukan SEMANTIK `SampleRowInput.readings` (bukan standar kalibrasi):
        - raw_signal: readings berisi detector response (cps/intensitas/luas area). C_sample diperoleh via inverse regression (y - c) / m.
        - in_vial_concentration: readings berisi konsentrasi in-vial hasil software alat (mis. Qtegra). C_sample dipakai langsung.

        CATATAN PENTING: deret standar kalibrasi WAJIB selalu menyertakan `signal` (c/s) pada kedua mode,
        karena kurva OLS y = mx + c hanya dapat dibangun dari pasangan (konsentrasi nominal, respon detektor).
      example: "in_vial_concentration"

    MetrologyUnits:
      type: object
      required: [solutionConcUnit, solidResultUnit, weightUnit, volumeUnit, signalUnit]
      properties:
        solutionConcUnit:
          type: string
          enum: [ppb, ppm, ppt]
          description: "Satuan konsentrasi larutan di vial (ppb = ug/L, ppm = mg/L, ppt = ng/L)"
          example: "ppb"
        solidResultUnit:
          type: string
          enum: [mg/kg, ug/kg, percent]
          description: "Satuan hasil akhir kuantifikasi sampel padatan"
          default: "mg/kg"
          example: "mg/kg"
        weightUnit:
          type: string
          enum: [g, mg]
          default: "g"
          example: "g"
        volumeUnit:
          type: string
          enum: [mL, L]
          default: "mL"
          example: "mL"
        signalUnit:
          type: string
          enum: [cps, intensity, peak_area]
          description: "Satuan pembacaan respon detektor. WAJIB, karena deret standar selalu menggunakan signal pada kedua inputMode."
          example: "cps"

    SampleType:
      type: string
      enum: [sample, blank_method, ccv, spike, duplicate]
      description: |
        - sample: sampel uji rutin lab
        - blank_method: blanko metode preparasi asam (untuk koreksi C_blank)
        - ccv: continuing calibration verification (larutan standar kontrol)
        - spike: sampel yang ditambahkan larutan standar spike (matrix spike)
        - duplicate: sampel ulangan duplo untuk verifikasi presisi RPD
      example: "sample"

    DetectionZone:
      type: string
      enum: [NOT_DETECTED, QUALITATIVE_ONLY, VALID_QUANTIFICATION]
      description: |
        - NOT_DETECTED: C_net <= 0 atau C_net < LOD (dilaporkan 'ND')
        - QUALITATIVE_ONLY: LOD <= C_net < LOQ (dilaporkan '< [LOQ_metode]')
        - VALID_QUANTIFICATION: C_net >= LOQ (dilaporkan angka numerik mg/kg)
      example: "VALID_QUANTIFICATION"

    QCStatus:
      type: string
      enum: [PASSED, INVALID_QC]
      example: "PASSED"

    # -----------------------------------------------------------------------
    # QC Criteria Profile Schemas (Governed, Versioned, Banded)
    # -----------------------------------------------------------------------
    # Model: kriteria QC TIDAK boleh di-hardcode. Setiap batch mereferensikan
    # sebuah profil bernama & ber-versi yang bersitasi methodRef. Analis TIDAK
    # dapat meng-override angka per batch. Profil di-snapshot immutable ke batch.
    #
    # Sumbu variasi: per analit x per tipe QC, dengan `bands` (rentang konsentrasi).
    # Kriteria flat direpresentasikan sebagai SATU band catch-all (maxConc: null).
    # -----------------------------------------------------------------------
    RecoveryBand:
      type: object
      required: [maxConc, minRecovery, maxRecovery]
      properties:
        maxConc:
          type: number
          nullable: true
          description: "Batas ATAS band (eksklusif) dalam solutionConcUnit. null = catch-all (tak hingga). Band terakhir WAJIB null."
          example: 100.0
        minRecovery:
          type: number
          description: "% recovery minimum yang diterima pada band ini"
          example: 90.0
        maxRecovery:
          type: number
          description: "% recovery maksimum yang diterima pada band ini"
          example: 110.0

    RpdBand:
      type: object
      required: [maxConc, maxRpd]
      properties:
        maxConc:
          type: number
          nullable: true
          description: "Batas ATAS band (eksklusif) dalam solutionConcUnit. null = catch-all (tak hingga). Band terakhir WAJIB null."
          example: 10.0
        maxRpd:
          type: number
          description: "% RPD maksimum yang diterima pada band ini"
          example: 25.0

    AnalyteCriteria:
      type: object
      required: [ccv, spike, duplicate]
      properties:
        ccv:
          type: object
          required: [bands]
          properties:
            bands:
              type: array
              minItems: 1
              description: "Band terurut menaik; batas kontigu & non-overlap; elemen terakhir maxConc wajib null."
              items:
                $ref: '#/components/schemas/RecoveryBand'
        spike:
          type: object
          required: [bands]
          properties:
            bands:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RecoveryBand'
        duplicate:
          type: object
          required: [bands]
          properties:
            bands:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RpdBand'

    QCCriteriaProfile:
      type: object
      required: [id, name, methodRef, version, effectiveDate, linearity, analytes]
      description: |
        Profil kriteria QC yang immutable & ber-versi. Mengubah angka = membuat versi baru.
        Batch WAJIB merujuk profil ini; tidak ada override per batch.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "QC Criteria Check — SOP Lab"
        methodRef:
          type: string
          description: "Sitasi sumber kriteria (nomor SOP / metode regulatori). Wajib untuk jejak audit."
          example: "Lab SOP QC CRITERIA CHECK"
        version:
          type: integer
          minimum: 1
          example: 1
        effectiveDate:
          type: string
          format: date
          example: "2026-09-27"
        solutionConcUnit:
          type: string
          enum: [ppb, ppm, ppt]
          nullable: true
          description: "Satuan batas band. Wajib bila terdapat band dengan maxConc finit; boleh null bila seluruh profil flat."
        linearity:
          type: object
          required: [minR]
          properties:
            minR:
              type: number
              description: "Batas minimal korelasi Pearson (global per profil, bukan per band)"
              example: 0.995
        analytes:
          type: object
          description: "WAJIB memuat entri untuk setiap analit yang dipakai batch (tanpa fallback implisit)."
          additionalProperties:
            $ref: '#/components/schemas/AnalyteCriteria'

    QCCriteriaProfileInput:
      type: object
      required: [name, methodRef, effectiveDate, linearity, analytes]
      description: "Payload pembuatan profil baru (server yang menetapkan id & version)."
      properties:
        name:
          type: string
        methodRef:
          type: string
        effectiveDate:
          type: string
          format: date
        solutionConcUnit:
          type: string
          enum: [ppb, ppm, ppt]
          nullable: true
        linearity:
          type: object
          required: [minR]
          properties:
            minR:
              type: number
        analytes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AnalyteCriteria'

    QcProfileRef:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer

    AppliedCriteria:
      type: object
      description: "Jejak audit: kriteria persis yang diterapkan pada evaluasi ini."
      properties:
        testValue:
          type: number
          nullable: true
          description: "Nilai konsentrasi yang dipakai untuk memilih band (CCV=expectedConc, spike=spikeAdded, duplo=mean C_net)."
        bandMaxConc:
          type: number
          nullable: true
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true

    # -----------------------------------------------------------------------
    # DataGrid Row Input Schemas
    # -----------------------------------------------------------------------
    StandardPointReading:
      type: object
      required: [nominalConc, signal]
      properties:
        nominalConc:
          type: number
          description: "Konsentrasi nominal larutan standar (dalam solutionConcUnit)"
          example: 10.0
        signal:
          type: number
          description: "Pembacaan respon detektor (c/s) untuk titik standar ini. WAJIB pada kedua inputMode (sumber kurva kalibrasi)."
          example: 12500.0

    StandardRowInput:
      type: object
      required: [standardName, readings]
      properties:
        standardName:
          type: string
          example: "Std 1"
        readings:
          type: object
          description: "Map nama analit -> pembacaan standar"
          additionalProperties:
            $ref: '#/components/schemas/StandardPointReading'
          example:
            Al: { nominalConc: 10.0, signal: 1500.0 }
            Pb: { nominalConc: 1.0, signal: 240.0 }
            Cd: { nominalConc: 0.5, signal: 95.0 }

    SampleRowInput:
      type: object
      required: [sampleId, sampleType, weight, volume, df, readings]
      properties:
        sampleId:
          type: string
          description: "ID atau label sampel"
          example: "1111 (1)"
        sampleType:
          $ref: '#/components/schemas/SampleType'
        parentSampleId:
          type: string
          nullable: true
          description: "ID sampel acuan (wajib untuk sampleType: duplicate dan spike)"
          example: "1111 (1)"
        spikeAdded:
          type: object
          nullable: true
          description: "Konsentrasi standar spike yang ditambahkan ke larutan (dalam solutionConcUnit)"
          additionalProperties:
            type: number
          example:
            Al: 20.0
            Pb: 2.0
        expectedConc:
          type: object
          nullable: true
          description: "Konsentrasi target teoritis larutan kontrol / CCV (dalam solutionConcUnit)"
          additionalProperties:
            type: number
          example:
            Al: 5.0
            Pb: 1.0
        weight:
          type: number
          description: "Bobot penimbangan sampel padatan (gram)"
          example: 0.2014
        volume:
          type: number
          description: "Volume akhir labu ukur preparasi (mL)"
          example: 50.0
        df:
          type: number
          default: 1.0
          description: "Faktor pengenceran (Dilution Factor)"
          example: 1.0
        readings:
          type: object
          description: "Map nama analit -> nilai pembacaan alat (sinyal cps atau konsentrasi terhitung di vial)"
          additionalProperties:
            type: number
          example:
            Al: 38.52
            Pb: 1.16
            Cd: 0.031

    # -----------------------------------------------------------------------
    # Batch Request & Response Schemas
    # -----------------------------------------------------------------------
    CalibrationBatchRequest:
      type: object
      required:
        - title
        - instrument
        - inputMode
        - units
        - qcProfileId
        - analytes
        - standards
        - samples
      properties:
        title:
          type: string
          example: "Pengujian ICP-MS Batch Biskuit Gandum"
        instrument:
          $ref: '#/components/schemas/InstrumentType'
        inputMode:
          $ref: '#/components/schemas/InputMode'
        units:
          $ref: '#/components/schemas/MetrologyUnits'
        qcProfileId:
          type: string
          format: uuid
          description: "Referensi profil kriteria QC ber-versi. Tidak ada override kriteria per batch."
          example: "3f8a1c2e-9b7d-4bad-9bdd-2b0d7b3dcb6d"
        analytes:
          type: array
          items:
            type: string
          minItems: 1
          example: ["Al", "Pb", "Cd", "As", "Hg"]
        standards:
          type: array
          items:
            $ref: '#/components/schemas/StandardRowInput'
          minItems: 4 # Blank + minimal 3 titik screening (Invariant D1: 5 untuk kurva formal)
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SampleRowInput'
          maxItems: 250 # Invariant T2: serverless memory bound

    AnalyteCurveMetrics:
      type: object
      required: [slope, intercept, r, rSquared, syx, lodInstrument, loqInstrument]
      properties:
        slope:
          type: number
          example: 240.5
        intercept:
          type: number
          example: 1.2
        r:
          type: number
          description: "Koefisien korelasi Pearson"
          example: 0.9998
        rSquared:
          type: number
          description: "Koefisien determinasi R²"
          example: 0.9996
        syx:
          type: number
          description: "Standar deviasi residual regresi s_{y/x}"
          example: 0.045
        lodInstrument:
          type: number
          description: "Limit of Detection instrumen di vial (dalam solutionConcUnit) = 3 * syx / slope"
          example: 0.005
        loqInstrument:
          type: number
          description: "Limit of Quantification instrumen di vial (dalam solutionConcUnit) = 10 * syx / slope"
          example: 0.015

    AnalyteSampleResult:
      type: object
      required: [cRaw, cNet, detectionZone, reportedValue, lodMethod, loqMethod]
      properties:
        cRaw:
          type: number
          description: "Pembacaan konsentrasi di vial sebelum koreksi blanko (dalam solutionConcUnit)"
          example: 1.16
        cNet:
          type: number
          description: "Konsentrasi larutan bersih setelah koreksi blanko (C_sample - C_blank)"
          example: 1.15
        concSolid:
          type: number
          nullable: true
          description: "Hasil kuantifikasi padatan (dalam solidResultUnit). NULL jika cNet < LOQ."
          example: 0.28678
        detectionZone:
          $ref: '#/components/schemas/DetectionZone'
        reportedValue:
          type: string
          description: "Format pelaporan resmi ISO 17025 ('ND', '< [LOQ_metode]', atau angka desimal)"
          example: "0.287 mg/kg"
        lodMethod:
          type: number
          description: "LOD metode PADA SAMPEL INI (solidResultUnit), dihitung dari W/V/dF sampel ini"
          example: 0.00125
        loqMethod:
          type: number
          description: "LOQ metode PADA SAMPEL INI (solidResultUnit), dipakai pada string '< [LOQ_metode]'"
          example: 0.00375
        rpd:
          type: number
          nullable: true
          description: "% Relative Percent Difference jika baris ini adalah duplo. Bernilai null bila rata-rata pasangan <= 0 (undefined)."
          example: 1.72
        spikeRecovery:
          type: number
          nullable: true
          description: "% Recovery jika baris ini adalah matrix spike"
          example: 99.0
        ccvRecovery:
          type: number
          nullable: true
          description: "% Recovery jika baris ini adalah CCV / larutan kontrol"
          example: 101.2

    EvaluatedSampleRow:
      type: object
      required: [sampleId, sampleType, weight, volume, df, analytes]
      properties:
        sampleId:
          type: string
          example: "1111 (1)"
        sampleType:
          $ref: '#/components/schemas/SampleType'
        parentSampleId:
          type: string
          nullable: true
          example: null
        weight:
          type: number
          example: 0.2014
        volume:
          type: number
          example: 50.0
        df:
          type: number
          example: 1.0
        analytes:
          type: object
          description: "Map nama analit -> hasil evaluasi metrologi"
          additionalProperties:
            $ref: '#/components/schemas/AnalyteSampleResult'

    QCViolationRecord:
      type: object
      required: [rule, analyte, expected, actual, message, profileVersion, appliedCriteria]
      properties:
        rule:
          type: string
          enum: [LINEARITY_R, CCV_RECOVERY, SPIKE_RECOVERY, DUPLICATE_RPD]
          example: "CCV_RECOVERY"
        analyte:
          type: string
          example: "Pb"
        sampleId:
          type: string
          nullable: true
          example: "CCV-Mid"
        expected:
          type: string
          example: "90.0% - 110.0%"
        actual:
          type: string
          example: "115.4%"
        message:
          type: string
          example: "Continuing Calibration Verification (CCV) melebihi batas drift toleransi 10%"
        profileVersion:
          type: integer
          description: "Versi profil kriteria yang diterapkan saat pelanggaran ini terjadi (jejak audit)."
          example: 1
        appliedCriteria:
          $ref: '#/components/schemas/AppliedCriteria'

    CalibrationBatchResponse:
      type: object
      required:
        - id
        - title
        - instrument
        - inputMode
        - units
        - qcProfileRef
        - qcProfileSnapshot
        - qcStatus
        - qcViolations
        - analytesSummary
        - evaluatedSamples
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        instrument:
          $ref: '#/components/schemas/InstrumentType'
        inputMode:
          $ref: '#/components/schemas/InputMode'
        units:
          $ref: '#/components/schemas/MetrologyUnits'
        qcProfileRef:
          $ref: '#/components/schemas/QcProfileRef'
        qcProfileSnapshot:
          allOf:
            - $ref: '#/components/schemas/QCCriteriaProfile'
            - description: "Snapshot immutable kriteria yang benar-benar diterapkan pada batch ini (agar hasil reproducible saat audit)."
        qcStatus:
          $ref: '#/components/schemas/QCStatus'
        qcViolations:
          type: array
          items:
            $ref: '#/components/schemas/QCViolationRecord'
        analytesSummary:
          type: object
          description: "Map nama analit -> ringkasan metrologi kurva regresi"
          additionalProperties:
            $ref: '#/components/schemas/AnalyteCurveMetrics'
        evaluatedSamples:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedSampleRow'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CalibrationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, title, instrument, qcStatus, createdAt]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              instrument:
                $ref: '#/components/schemas/InstrumentType'
              qcStatus:
                $ref: '#/components/schemas/QCStatus'
              createdAt:
                type: string
                format: date-time
        meta:
          type: object
          required: [page, limit, totalItems, totalPages]
          properties:
            page:
              type: integer
            limit:
              type: integer
            totalItems:
              type: integer
            totalPages:
              type: integer

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Permintaan tidak dapat diproses."
        details:
          type: array
          items:
            type: string
          example: ["Deret kalibrasi wajib memiliki minimal 5 konsentrasi non-zero."]
